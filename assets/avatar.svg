<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="claude-fork-join">
  <title>claude-fork-join</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- wave gutters -->
  <g stroke="#2b3947" stroke-width="3" stroke-dasharray="10 12">
    <line x1="186" y1="86" x2="186" y2="426"/>
    <line x1="326" y1="86" x2="326" y2="426"/>
  </g>

  <!-- fork / join edges -->
  <g fill="none" stroke="#e07a4e" stroke-width="17" stroke-linecap="round">
    <path d="M116 256 C 152 256, 150 136, 186 136"/>
    <path d="M116 256 L 186 256"/>
    <path d="M116 256 C 152 256, 150 376, 186 376"/>
    <path d="M326 136 C 362 136, 360 256, 396 256"/>
    <path d="M326 256 L 396 256"/>
    <path d="M326 376 C 362 376, 360 256, 396 256"/>
  </g>

  <!-- worker lanes -->
  <g fill="none" stroke="#f2f5f8" stroke-width="17" stroke-linecap="round">
    <line x1="186" y1="136" x2="326" y2="136"/>
    <line x1="186" y1="256" x2="326" y2="256"/>
    <line x1="186" y1="376" x2="326" y2="376"/>
  </g>

  <!-- nodes -->
  <g fill="#0d1117" stroke="#f2f5f8" stroke-width="15">
    <circle cx="186" cy="136" r="26"/>
    <circle cx="186" cy="256" r="26"/>
    <circle cx="186" cy="376" r="26"/>
    <circle cx="326" cy="136" r="26"/>
    <circle cx="326" cy="256" r="26"/>
    <circle cx="326" cy="376" r="26"/>
  </g>
  <g fill="#e07a4e">
    <circle cx="106" cy="256" r="34"/>
    <circle cx="406" cy="256" r="34"/>
  </g>
</svg>
